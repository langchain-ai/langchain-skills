# Runs the Python code samples in the skills against the latest LangChain, LangGraph and
# Deep Agents releases. Chat models and embeddings are faked, so no API keys are needed.
# The weekly run catches samples that a new release breaks between PRs.
name: code-samples

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Run code samples
        run: |
          uv run --no-project --python 3.12 --refresh \
            --with-requirements scripts/samples/requirements.txt \
            scripts/check_samples.py
