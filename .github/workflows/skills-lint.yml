name: skills-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a plugin version bump for skill changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- config/skills/; then
            exit 0
          fi

          base_version="$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r '.version')"
          head_version="$(git show "$HEAD_SHA:.claude-plugin/plugin.json" | jq -r '.version')"
          version_pattern='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'

          if [[ ! "$base_version" =~ $version_pattern ]]; then
            echo "Base plugin version is not a supported semantic version: $base_version"
            exit 1
          fi
          base_major="${BASH_REMATCH[1]}"
          base_minor="${BASH_REMATCH[2]}"
          base_patch="${BASH_REMATCH[3]}"

          if [[ ! "$head_version" =~ $version_pattern ]]; then
            echo "Head plugin version is not a supported semantic version: $head_version"
            exit 1
          fi
          head_major="${BASH_REMATCH[1]}"
          head_minor="${BASH_REMATCH[2]}"
          head_patch="${BASH_REMATCH[3]}"

          if ((
            head_major < base_major
            || (head_major == base_major && head_minor < base_minor)
            || (head_major == base_major && head_minor == base_minor && head_patch <= base_patch)
          )); then
            echo "Skill changes require a plugin version greater than $base_version; found $head_version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Provides the `claude` binary for `plugin validate` and `plugin details`.
      # Validation is offline and consumes no secrets.
      - run: npm install -g @anthropic-ai/claude-code@2.1.273

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Test skill lint rules
        run: uv run --no-project --python 3.11 python -m unittest discover -s tests/skills_lint -v

      - run: uv run --no-project scripts/lint_skills.py
